name: build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ── Compile gate ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (Windows / .NET 8)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Kacher.sln

      - name: Build
        run: dotnet build Kacher.sln --configuration Release --no-restore

  # ── Runnable application ──────────────────────────────────────────────────────────────────────
  # WPF can only be published on Windows: the XAML markup compiler and the Windows Desktop
  # targeting pack are Windows-only. This job produces a self-contained win-x64 folder, so the
  # machine that runs the till needs nothing installed.
  publish:
    name: Publish app (win-x64)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '1.0.0' }
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Publish
        run: >
          dotnet publish src/Kacher.Pos/Kacher.Pos.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output dist/KacherPos
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:DebugType=embedded

      - name: Verify the executable exists
        shell: pwsh
        run: |
          $exe = 'dist/KacherPos/Kacher.Pos.exe'
          if (-not (Test-Path $exe)) { throw "Publish did not produce $exe" }
          $size = [math]::Round((Get-ChildItem dist/KacherPos -Recurse -File |
                                Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Kacher.Pos.exe ready - $size MB"

      - name: Upload application folder
        uses: actions/upload-artifact@v4
        with:
          name: kacher-pos-win-x64
          path: dist/KacherPos
          if-no-files-found: error
          retention-days: 30

  # ── Customer-facing installer ─────────────────────────────────────────────────────────────────
  installer:
    name: Build installer (setup.exe)
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach assets to a tag release

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '1.0.0' }
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        env:
          KACHER_VERSION: ${{ steps.version.outputs.value }}
        run: |
          & .\build-installer.ps1 -Version $env:KACHER_VERSION

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kacher-pos-installer
          path: dist/KacherPOS-*-setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KacherPOS-*-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
